<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The mark is the road ahead: three dashes of a path already laid down, and a chevron that has not
  travelled it yet. Speculation is the dashes.

  Two things were tuned by looking at the render rather than the numbers. The chevron is stroked,
  not filled — a triangle's apex collapses to mud at 32px, and round caps and joins hold it. The
  dashes are elongated — at a square-ish ratio their rounded ends meet and they read as three
  dots rather than as a road.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Speculatr">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#4D7C0F"/>

  <!-- The path already laid down -->
  <rect x="10" y="45" width="15" height="10" rx="5" fill="#FEFEFE"/>
  <rect x="30" y="45" width="15" height="10" rx="5" fill="#FEFEFE"/>
  <rect x="50" y="45" width="15" height="10" rx="5" fill="#FEFEFE"/>

  <!-- The part of it nobody has travelled yet -->
  <path d="M70 37 L83 50 L70 63" fill="none" stroke="#FEFEFE" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
