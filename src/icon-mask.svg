<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav mask: the road ahead on its own, black on transparent, no tile.

  Same geometry as src/icon.svg — three dashes and a stroked chevron — so the two never drift.
  The mark's painted bounds are x 10–88, y 32–68 (the chevron's round caps and join reach 5 units
  past its path); the transform scales that 78-unit width to 92 and centres it in 100x100.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Speculatr</title>
  <g transform="translate(50 50) scale(1.179487) translate(-49 -50)">
    <rect x="10" y="45" width="15" height="10" rx="5" fill="#000000"/>
    <rect x="30" y="45" width="15" height="10" rx="5" fill="#000000"/>
    <rect x="50" y="45" width="15" height="10" rx="5" fill="#000000"/>
    <path d="M70 37 L83 50 L70 63" fill="none" stroke="#000000" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
